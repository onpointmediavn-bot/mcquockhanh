  <style>
    /* Ẩn hình nền các phần (trừ Hero) để giao diện sạch và tập trung hơn */
    .chinhluan-page .poster-bg:not(#hero-poster .poster-bg) {
      display: none !important;
    }

    /* Ẩn lớp phủ gradient màu xanh/navy (trừ Hero) để tránh bị đè mờ màu xanh */
    .chinhluan-page .poster-overlay-gradient:not(#hero-poster .poster-overlay-gradient) {
      display: none !important;
    }

    /* Ẩn lớp phủ projector spotlight chiếu mờ toàn màn hình */
    .chinhluan-page .projector-glow {
      display: none !important;
    }

    /* Đặt nền đen thuần cho toàn bộ trang chính luận và các section */
    .chinhluan-page,
    .chinhluan-page body,
    .chinhluan-page .bg-navy,
    .chinhluan-page section {
      background-color: #000000 !important;
    }

    /* Hiệu ứng lưới ô vuông xen kẽ kiểu ngựa vằn (Zebra Grid) cho các phần chẵn */
    .chinhluan-page section:nth-of-type(even) {
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px) !important;
      background-size: 60px 60px !important;
      background-position: center !important;
    }

    /* Lớp chứa các đốm sáng ambient leaks */
    .chinhluan-page .ambient-blobs {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2; /* trên nền đen chẵn/lẻ nhưng dưới nội dung */
      pointer-events: none;
      overflow: hidden;
    }

    .chinhluan-page .blob {
      position: absolute;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      filter: blur(100px);
      mix-blend-mode: screen;
      animation: floatBlob 25s ease-in-out infinite alternate;
    }

    .chinhluan-page .blob-1 {
      top: -200px;
      left: -200px;
      background: radial-gradient(circle, rgba(223, 84, 44, 0.04) 0%, rgba(242, 153, 26, 0.01) 50%, transparent 100%);
      animation-duration: 35s;
    }

    .chinhluan-page .blob-2 {
      bottom: -200px;
      right: -200px;
      background: radial-gradient(circle, rgba(146, 26, 34, 0.05) 0%, rgba(223, 84, 44, 0.01) 50%, transparent 100%);
      animation-duration: 40s;
      animation-delay: -5s;
    }

    .chinhluan-page .blob-3 {
      top: 30%;
      left: 40%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(242, 153, 26, 0.03) 0%, transparent 100%);
      animation-duration: 25s;
      animation-delay: -10s;
    }

    @keyframes floatBlob {
      0% {
        transform: translate(0, 0) scale(1);
      }
      50% {
        transform: translate(150px, 80px) scale(1.15);
      }
      100% {
        transform: translate(-100px, 150px) scale(0.9);
      }
    }

    /* Đường quét ánh sáng laser ngang chuyển động chậm (Scanline Beam) */
    .chinhluan-page::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, 
        transparent 0%, 
        rgba(223, 84, 44, 0.15) 30%, 
        rgba(242, 153, 26, 0.35) 50%, 
        rgba(223, 84, 44, 0.15) 70%, 
        transparent 100%);
      box-shadow: 0 0 20px rgba(242, 153, 26, 0.3);
      z-index: 4; /* trên các hạt canvas nhưng dưới nội dung */
      pointer-events: none;
      animation: scanlineSweep 16s ease-in-out infinite;
    }

    @keyframes scanlineSweep {
      0% {
        transform: translateY(-20vh);
        opacity: 0;
      }
      5% {
        opacity: 0.7;
      }
      95% {
        opacity: 0.7;
      }
      100% {
        transform: translateY(120vh);
        opacity: 0;
      }
    }
  </style>

  <!-- Main Container -->
